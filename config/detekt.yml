config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  # when writing own rules with new properties, exclude the property path e.g.: ['my_rule_set', '.*>.*>[my_property]']
  excludes: []

naming:
  active: true
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated:
      - Composable
      - Preview
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  active: true
  UnusedPrivateProperty:
    active: true
    allowedNames: '_|ignored|expected|serialVersionUID|commonMain|iosMain|androidMain|commonTest|iosTest|androidTest|debug|enterprise|release'
  UnusedPrivateFunction:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
  MaxLineLength:
    active: true
    maxLineLength: 140 # Keep aligned with .editorconfig file to prevent false positives
  MagicNumber:
    active: true
    ignoreAnnotated:
      - Preview
      - ScreenPreviews
      - ComponentPreviews
      - DarkLightPreviews
  DestructuringDeclarationWithTooManyEntries:
    active: true
    ignoreAnnotated:
      - Composable
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      # moko-resources generates every resource as an extension property of `MR`, so each one would need its own import
      - 'com.syntey.spiriteddriving.core.resources.*' # Keep aligned with .editorconfig file

complexity:
  LongParameterList:
    active: true
    ignoreAnnotated:
      - Composable
      # Koin fills these constructors; components gain a use case per action
      - Factory
  TooManyFunctions:
    active: true
    allowedFunctionsPerInterface: 25
    allowedFunctionsPerClass: 30
    allowedFunctionsPerFile: 20
    allowedFunctionsPerObject: 20
    # Previews sit at the bottom of their composable's file, one per state and platform, so they don't count
    ignoreAnnotatedFunctions:
      - Preview
      - ComponentPreviews
      - ScreenPreviews
    # A Room DAO has one function per query
    ignoreAnnotated:
      - Dao
  LongMethod:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
