#Gradle
org.gradle.jvmargs=-Xmx8g -Xms256m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-XX:MaxMetaspaceSize=2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
# Use this flag carefully in case some of the plugins are not fully compatible.
org.gradle.configuration-cache.problems=warn

#Kotlin
kotlin.code.style=official
# Kotlin/Native compiler memory (runs in separate process). Linking a framework with Compose Multiplatform needs more than the default.
kotlin.native.jvmArgs=-Xmx10g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
kotlin.native.disableCompilerDaemon=true
# Leave the Apple targets to Apple hosts. Kotlin can build their klibs on Linux too, but the compilation still runs `xcrun`,
# which a Linux CI runner does not have. Nothing changes on a Mac.
kotlin.native.enableKlibsCrossCompilation=false

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

#BuildKonfig
buildkonfig.flavor=dev

#Moko
moko.resources.disableStaticFrameworkWarning=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
