[versions]
agp = "9.5.1"
kotlin = "2.4.10"
ksp = "2.3.13"
desugarLibs = "2.1.5"
# Android-only, consumed by `androidApp`
androidxLifecycle = "2.11.0"
androidxComposeBom = "2026.09.00"
materialIcons = "1.7.8"
# Needs to align with version in Compose BOM as closely as possible
composeMultiplatform = "1.12.2"
# Versioned separately from `composeMultiplatform`, see `compose.material3` in CMP Gradle plugin
composeMultiplatformMaterial3 = "1.9.0"
# No longer published together with `composeMultiplatform`
composeMultiplatformMaterialIcons = "1.7.3"
# The Compose Multiplatform counterpart of `androidxLifecycle`, consumed by Compose modules
jetbrainsLifecycle = "2.11.0"
androidxActivity = "1.13.0"
decompose = "3.6.1"
essenty = "2.7.1"
koin = "4.2.2"
# Must be compatible with: `kotlin`
# Held at 1.2.1 (pinned in the root build script): 1.2.2 and 1.2.3 break the iOS framework link, because `:shared`
# re-declares the `@Configuration` hints of the feature modules it exports. https://github.com/InsertKoinIO/koin-compiler-plugin/issues/146
koinCompilerPlugin = "1.2.1"
kotlinx-coroutines = "1.11.0"
kotlinx-immutableCollections = "0.5.2"
kotlinx-dateTime = "0.8.0"
ktlintGradlePlugin = "14.2.0"
ktlint = "1.8.0"
detektGradlePlugin = "2.0.0-alpha.6"
composeLint = "1.6.1"
# Must be compatible with: `ksp`
ktorfit = "2.7.5"
# Must be compatible with: `ktorfit`
ktor = "3.5.2"
# Must be compatible with: `kotlin`
kotlinx-serialization = "1.12.0"
timber = "5.0.1"
kermit = "2.2.0"
# Must be compatible with: `kotlin`
skie = "0.10.16"
buildkonfig = "0.24.0"
nsExceptionKt = "1.0.0-BETA-7"
datastore = "1.3.0"
moko-resources = "0.27.1"
baselineProfile = "1.5.0"
junit = "1.3.0"
espressoCore = "3.7.0"
uiautomator = "2.4.1"
benchmarkMacroJunit4 = "1.5.0"
profileinstaller = "1.4.1"
google-servicesPlugin = "4.5.0"
google-firebaseAppDistributionPlugin = "5.3.1"
arkitekt = "6.1.0"
versionCatalogUpdate = "1.1.2"
modulesGraphAssert = "2.9.1"
konsist = "1.0.0-beta.1"

# Android Namespaces (shared modules derive theirs from their path, see `conventions-kmp-library`)
project-android-namespace = "com.syntey.spiriteddriving.android"
project-baselineprofile-namespace = "com.syntey.spiriteddriving.baselineprofile"

[libraries]
# Arkitekt
futured-arkitekt-decompose = { module = "app.futured.arkitekt:decompose", version.ref = "arkitekt" }
futured-arkitekt-decomposeAnnotation = { module = "app.futured.arkitekt:decompose-annotation", version.ref = "arkitekt" }
futured-arkitekt-decomposeProcessor = { module = "app.futured.arkitekt:decompose-processor", version.ref = "arkitekt" }
futured-arkitekt-crUseCases = { module = "app.futured.arkitekt:cr-usecases", version.ref = "arkitekt" }
# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
# Compose Multiplatform
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
jetbrains-compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeMultiplatformMaterialIcons" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-immutableCollections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-immutableCollections" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-dateTime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-dateTime" }
# AndroidX
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
# Decompose
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose-ext = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
essenty = { module = "com.arkivanov.essenty:lifecycle", version.ref = "essenty" }
# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
# Desugar
androidTools-desugarLibs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarLibs" }
# Lint
lint-compose = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLint" }
# Logging
logging-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
logging-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
logging-kermitCrashlytics = { module = "co.touchlab:kermit-crashlytics", version.ref = "kermit" }
logging-nsExceptionKt-core = { module = "com.rickclephas.kmp:nsexception-kt-core", version.ref = "nsExceptionKt" }
# Moko
moko-resources = { module = "dev.icerock.moko:resources", version.ref = "moko-resources" }
moko-resources-compose = { module = "dev.icerock.moko:resources-compose", version.ref = "moko-resources" }
# Network
network-ktorfit-ksp = { module = "de.jensklingenberg.ktorfit:ktorfit-ksp", version.ref = "ktorfit" }
network-ktorfit-lib = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
network-ktorfit-converters = { module = "de.jensklingenberg.ktorfit:ktorfit-converters-response", version.ref = "ktorfit" }
network-ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
network-ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
network-ktor-client-engine-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
network-ktor-client-engine-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
network-ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Datastore
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
# Convention plugin dependencies
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-kotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradlePlugin-koin = { module = "io.insert-koin:koin-compiler-gradle-plugin", version.ref = "koinCompilerPlugin" }
gradlePlugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradlePlugin" }
gradlePlugin-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detektGradlePlugin" }
gradlePlugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
moko-resources = { id = "dev.icerock.mobile.multiplatform-resources", version.ref = "moko-resources" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-servicesPlugin" }
firebase-distribution = { id = "com.google.firebase.appdistribution", version.ref = "google-firebaseAppDistributionPlugin" }
detekt = { id = "dev.detekt", version.ref = "detektGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
koin = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompilerPlugin" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
modules-graph-assert = { id = "com.jraska.module.graph.assertion", version.ref = "modulesGraphAssert" }
# Precompiled script plugins
conventions-root = { id = "conventions-root" }
conventions-lint = { id = "conventions-lint" }
conventions-kmp-library = { id = "conventions-kmp-library" }
conventions-compose = { id = "conventions-compose" }
conventions-arkitekt = { id = "conventions-arkitekt" }
conventions-kmp-feature = { id = "conventions-kmp-feature" }
conventions-koin = { id = "conventions-koin" }

[bundles]
compose = [
    "androidx-compose-foundation",
    "androidx-compose-material-icons",
    "androidx-compose-material3",
    "androidx-compose-runtime",
    "androidx-compose-ui",
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-tooling-preview",
]
ktorfit = [
    "network-ktor-client-contentNegotiation",
    "network-ktor-client-logging",
    "network-ktor-serialization-kotlinx-json",
    "network-ktorfit-converters",
    "network-ktorfit-lib",
]
